services:
  models-frame-resources:
    build: .
    command: python /app/server.py
    environment:
      ENV_ID: dev
      SERVICE_NAME: models-frame-resources
      # Memory optimization settings (removed conflicting CUDA and TF settings)
      TF_FORCE_GPU_ALLOW_GROWTH: true
      TF_CPP_MIN_LOG_LEVEL: 2
      PYTHONUNBUFFERED: 1
    ports:
      - 8540:8540
    volumes:
      - .:/app
    tty: true
    restart: always